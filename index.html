<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشركة - تجربة تسجيل الدخول</title>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9;">

    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center;">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"><br>
        <input type="password" id="password" placeholder="كلمة المرور" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"><br><br>
        
        <button onclick="signUp()" style="width: 48%; padding: 10px; background: #24b47e; color: white; border: none; border-radius: 5px; cursor: pointer;">إنشاء حساب</button>
        <button onclick="signIn()" style="width: 48%; padding: 10px; background: #3ecf8e; color: white; border: none; border-radius: 5px; cursor: pointer;">تسجيل دخول</button>

        <p id="status" style="margin-top: 15px; font-size: 14px; color: #333;"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://uuiqoqcggmtazmoduedc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Fe5XX4qvlgQXUeXiI4i3LQ_J_YZ-v7n';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('status').innerText = 'جاري المعالجة...';

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                document.getElementById('status').innerText = '❌ خطأ: ' + error.message;
            } else {
                document.getElementById('status').innerText = '✅ تم إنشاء الحساب بنجاح!';
            }
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('status').innerText = 'جاري المعالجة...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('status').innerText = '❌ خطأ: ' + error.message;
            } else {
                document.getElementById('status').innerText = '✅ تم تسجيل الدخول بنجاح!';
            }
        }
    </script>
</body>
</html>
